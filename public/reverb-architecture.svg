<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%" style="background-color: #080c14; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Box Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1524" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#110d1e" />
    </linearGradient>

    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="blueBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="greenBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <linearGradient id="redBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Connector lines gradient -->
    <linearGradient id="lineGradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    
    <linearGradient id="lineGradGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171" />
    </marker>
  </defs>

  <!-- Background base -->
  <rect width="920" height="560" fill="url(#bgGlow)" />

  <!-- Subgrid/Pattern -->
  <g opacity="0.05">
    <path d="M 0,40 H 920 M 0,80 H 920 M 0,120 H 920 M 0,160 H 920 M 0,200 H 920 M 0,240 H 920 M 0,280 H 920 M 0,320 H 920 M 0,360 H 920 M 0,400 H 920 M 0,440 H 920 M 0,480 H 920 M 0,520 H 920" stroke="#ffffff" stroke-width="1" />
    <path d="M 40,0 V 560 M 80,0 V 560 M 120,0 V 560 M 160,0 V 560 M 200,0 V 560 M 240,0 V 560 M 280,0 V 560 M 320,0 V 560 M 360,0 V 560 M 400,0 V 560 M 440,0 V 560 M 480,0 V 560 M 520,0 V 560 M 560,0 V 560 M 600,0 V 560 M 640,0 V 560 M 680,0 V 560 M 720,0 V 560 M 760,0 V 560 M 800,0 V 560 M 840,0 V 560 M 880,0 V 560" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Title -->
  <text x="30" y="40" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="0.5">LARAVEL REVERB EVENT-DRIVEN FLOW</text>
  <text x="30" y="58" fill="#64748b" font-size="12" font-weight="500">Decoupled real-time WebSocket broadcasting architecture</text>

  <!-- ==================== CONNECTIONS / PIPELINES ==================== -->
  
  <!-- Browser <-> Nginx (WSS Link) -->
  <path d="M 230,150 H 335" stroke="url(#lineGradBlue)" stroke-dasharray="4 4" stroke-width="2.5" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" />
  <rect x="247" y="128" width="70" height="18" rx="4" fill="#080c14" stroke="#0284c7" stroke-width="1" />
  <text x="282" y="141" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">WSS (Port 443)</text>

  <!-- Nginx -> Reverb (Local Proxy) -->
  <path d="M 500,150 H 660" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-purple)" />
  <rect x="525" y="128" width="95" height="18" rx="4" fill="#080c14" stroke="#7e22ce" stroke-width="1" />
  <text x="572" y="141" fill="#c084fc" font-size="9" font-weight="bold" text-anchor="middle">Proxy Pass (8080)</text>

  <!-- Client Browser -> Controller (HTTP Link) -->
  <path d="M 140,210 V 330 C 140,360 210,360 250,360 H 335" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="180" y="270" width="80" height="18" rx="4" fill="#080c14" stroke="#059669" stroke-width="1" />
  <text x="220" y="282" fill="#34d399" font-size="9" font-weight="bold" text-anchor="middle">HTTP POST Bid</text>

  <!-- Controller -> Redis (Queue Dispatch) -->
  <path d="M 500,380 H 670" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <rect x="535" y="358" width="90" height="18" rx="4" fill="#080c14" stroke="#b91c1c" stroke-width="1" />
  <text x="580" y="371" fill="#f87171" font-size="9" font-weight="bold" text-anchor="middle">Queue:dispatch()</text>

  <!-- Redis -> Reverb Worker (Queue Worker & Pub/Sub) -->
  <path d="M 750,330 V 210" stroke="#a855f7" stroke-dasharray="4 4" stroke-width="2.5" marker-end="url(#arrow-purple)" />
  <rect x="760" y="258" width="90" height="28" rx="4" fill="#080c14" stroke="#7e22ce" stroke-width="1" />
  <text x="805" y="270" fill="#c084fc" font-size="8.5" font-weight="bold" text-anchor="middle">Horizon Worker</text>
  <text x="805" y="280" fill="#94a3b8" font-size="7.5" text-anchor="middle">Pub/Sub Broadcast</text>


  <!-- ==================== NODES / CARDS ==================== -->

  <!-- NODE 1: CLIENT BROWSER (WS CLIENT) -->
  <g transform="translate(30, 90)" filter="url(#shadow)">
    <rect width="200" height="120" rx="8" fill="url(#blueCard)" stroke="url(#blueBorder)" stroke-width="1.5" />
    <!-- Browser window header -->
    <rect width="200" height="22" rx="8" fill="#0f172a" />
    <circle cx="12" cy="11" r="3" fill="#ef4444" />
    <circle cx="20" cy="11" r="3" fill="#f59e0b" />
    <circle cx="28" cy="11" r="3" fill="#10b981" />
    <!-- Content -->
    <text x="15" y="45" fill="#f8fafc" font-size="12" font-weight="bold">Client Dashboard</text>
    <text x="15" y="62" fill="#64748b" font-size="9.5">State: Listening to Echo</text>
    <text x="15" y="74" fill="#38bdf8" font-size="9" font-family="monospace">channel: 'auction.{id}'</text>
    <!-- Connection Pill -->
    <rect x="15" y="88" width="85" height="18" rx="9" fill="#065f46" opacity="0.8" />
    <circle cx="23" cy="97" r="3.5" fill="#34d399" />
    <text x="32" y="100" fill="#34d399" font-size="8.5" font-weight="bold">Echo Active</text>
  </g>

  <!-- NODE 2: NGINX REVERSE PROXY -->
  <g transform="translate(340, 90)" filter="url(#shadow)">
    <rect width="160" height="120" rx="8" fill="url(#blueCard)" stroke="url(#purpleBorder)" stroke-width="1.5" />
    <rect width="160" height="6" rx="3" fill="#7e22ce" />
    
    <!-- Icon Placeholder (Lock/SSL) -->
    <path d="M 22 28 A 6 6 0 0 1 34 28 M 22 28 V 36 H 34 V 28 Z" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <text x="44" y="34" fill="#f8fafc" font-size="12" font-weight="bold">Nginx Reverse Proxy</text>
    
    <text x="15" y="55" fill="#94a3b8" font-size="9.5">SSL Termination &amp; Routing</text>
    <text x="15" y="72" fill="#64748b" font-size="9">Handles WS handshakes</text>
    <text x="15" y="85" fill="#64748b" font-size="9">Upgrades HTTP headers</text>
    
    <!-- Port tag -->
    <rect x="15" y="96" width="55" height="14" rx="3" fill="#1e1b4b" />
    <text x="42" y="106" fill="#a5b4fc" font-size="8.5" font-weight="bold" font-family="monospace" text-anchor="middle">Port 443</text>
  </g>

  <!-- NODE 3: LARAVEL REVERB WEBSOCKET SERVER -->
  <g transform="translate(670, 90)" filter="url(#shadow)">
    <rect width="220" height="120" rx="8" fill="url(#blueCard)" stroke="url(#purpleBorder)" stroke-width="1.5" />
    <rect width="220" height="6" rx="3" fill="#a855f7" />
    
    <!-- Reverb Label -->
    <text x="15" y="32" fill="#f8fafc" font-size="13" font-weight="800" fill-opacity="0.9">Laravel Reverb</text>
    <text x="15" y="47" fill="#c084fc" font-size="9" font-family="monospace">ReactPHP Reactor Loop</text>
    
    <text x="15" y="68" fill="#94a3b8" font-size="9.5">Handles persistent TCP sockets</text>
    <text x="15" y="81" fill="#64748b" font-size="9">Distributes client packets</text>
    
    <!-- Tech specs -->
    <rect x="15" y="94" width="70" height="16" rx="3" fill="#3b0764" />
    <text x="50" y="105" fill="#d8b4fe" font-size="8.5" font-weight="bold" text-anchor="middle">Non-Blocking</text>
  </g>

  <!-- NODE 4: LARAVEL APPLICATION (CONTROLLER) -->
  <g transform="translate(340, 320)" filter="url(#shadow)">
    <rect width="160" height="120" rx="8" fill="url(#blueCard)" stroke="url(#greenBorder)" stroke-width="1.5" />
    <rect width="160" height="6" rx="3" fill="#059669" />
    
    <text x="15" y="32" fill="#f8fafc" font-size="12" font-weight="bold">Laravel 13 App</text>
    <text x="15" y="46" fill="#64748b" font-size="9">BidController@place</text>
    
    <text x="15" y="68" fill="#94a3b8" font-size="9.5">Processes HTTP request</text>
    <text x="15" y="81" fill="#64748b" font-size="9">Persists bid log to DB</text>
    
    <rect x="15" y="94" width="80" height="16" rx="3" fill="#064e3b" />
    <text x="55" y="105" fill="#a7f3d0" font-size="8.5" font-weight="bold" text-anchor="middle">ShouldBroadcast</text>
  </g>

  <!-- NODE 5: REDIS (QUEUE & PUB/SUB) -->
  <g transform="translate(670, 320)" filter="url(#shadow)">
    <rect width="220" height="120" rx="8" fill="url(#blueCard)" stroke="url(#redBorder)" stroke-width="1.5" />
    <rect width="220" height="6" rx="3" fill="#ef4444" />
    
    <!-- Redis cylinder diagram drawing -->
    <g transform="translate(185, 20)" opacity="0.6">
      <ellipse cx="15" cy="10" rx="12" ry="5" fill="#f87171" />
      <path d="M 3,10 V 22 A 12 5 0 0 0 27,22 V 10" fill="#ef4444" />
      <ellipse cx="15" cy="22" rx="12" ry="5" fill="#f87171" stroke="#ef4444" stroke-width="0.5" />
      <path d="M 3,22 V 34 A 12 5 0 0 0 27,34 V 22" fill="#b91c1c" />
      <ellipse cx="15" cy="34" rx="12" ry="5" fill="#f87171" stroke="#b91c1c" stroke-width="0.5" />
    </g>

    <text x="15" y="32" fill="#f8fafc" font-size="13" font-weight="bold">Redis Data Broker</text>
    <text x="15" y="46" fill="#f87171" font-size="9" font-family="monospace">In-Memory Engine (7.2)</text>
    
    <text x="15" y="68" fill="#94a3b8" font-size="9.5">Stores serialized payloads</text>
    <text x="15" y="81" fill="#64748b" font-size="9">Buffers job load under spikes</text>

    <!-- Stats pill -->
    <rect x="15" y="94" width="70" height="16" rx="3" fill="#7f1d1d" />
    <text x="50" y="105" fill="#fecaca" font-size="8.5" font-weight="bold" text-anchor="middle">Redis Queue</text>
  </g>

  <!-- ==================== WORKFLOW STEPS DETAILS ==================== -->
  
  <!-- Outer overlay step boxes (1, 2, 3, 4) -->
  <!-- Step 1 -->
  <circle cx="215" cy="328" r="10" fill="#34d399" filter="url(#glow)" />
  <text x="215" y="331" fill="#042f1a" font-size="9" font-weight="900" text-anchor="middle">1</text>
  
  <!-- Step 2 -->
  <circle cx="580" cy="345" r="10" fill="#f87171" filter="url(#glow)" />
  <text x="580" y="348" fill="#450a0a" font-size="9" font-weight="900" text-anchor="middle">2</text>

  <!-- Step 3 -->
  <circle cx="820" cy="235" r="10" fill="#c084fc" filter="url(#glow)" />
  <text x="820" y="238" fill="#2e1065" font-size="9" font-weight="900" text-anchor="middle">3</text>

  <!-- Step 4 -->
  <circle cx="572" cy="115" r="10" fill="#c084fc" filter="url(#glow)" />
  <text x="572" y="118" fill="#2e1065" font-size="9" font-weight="900" text-anchor="middle">4</text>

  <!-- Step 5 -->
  <circle cx="282" cy="115" r="10" fill="#38bdf8" filter="url(#glow)" />
  <text x="282" y="118" fill="#0369a1" font-size="9" font-weight="900" text-anchor="middle">5</text>

</svg>
